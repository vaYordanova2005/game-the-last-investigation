[/Script/Engine.RendererSettings]
; Exposure is fixed by the room's post process volume. Auto-exposure would keep re-brightening the
; dark corners the player is meant to have to walk into, and blow out every lightning flash.
r.DefaultFeature.AutoExposure=False
; Lumen GI and reflections: the scene has no baked lighting at all (every surface is Movable and
; built at runtime), so dynamic GI is what carries the single bounce of lantern light off the floor.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Shadow.Virtual.Enable=1
; Volumetric fog is load-bearing here, not decoration — it is what makes the lantern a visible cone
; and each lightning strike a shaft through the window rather than a flat wash on the wall.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=6
r.VolumetricFog.GridSizeZ=160
; Nanite on for the project, though nothing in Room01 currently uses it: the room is built from
; engine basic shapes, which are low-poly enough that Nanite would cost more than it saves. It
; matters once real high-density meshes arrive.
r.Nanite=1
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=True
r.AmbientOcclusion.Method=1

